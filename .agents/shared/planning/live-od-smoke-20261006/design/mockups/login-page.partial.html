<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Ensemble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --fg: #0F172A;
      --muted: #64748B;
      --placeholder: #94A3B8;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-press: #1E40AF;
      --disabled: #94A3B8;
      --error-bg: #FEF2F2;
      --error-border: #FECACA;
      --error-fg: #B91C1C;
      --focus-ring: 0 0 0 3px rgba(34, 99, 235, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .mark svg { display: block; }

    h1.app-name {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      color: var(--fg);
      margin: 0 0 8px 0;
      letter-spacing: -0.015em;
    }

    .tagline {
      font-size: 15px;
      color: var(--muted);
      margin: 0;
    }

    form { display: flex; flex-direction: column; }

    .field { margin-bottom: 16px; }

    label.field-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"].pw {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
      -webkit-appearance: none;
    }

    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    input:hover:not(:focus) {
      border-color: var(--border-strong);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }

    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px var(--surface) inset;
      -webkit-text-fill-color: var(--fg);
    }

    .pw-wrap { position: relative; }

    .pw-wrap input { padding-right: 48px; }

    .toggle-pw {
      position: absolute;
      top: 1px;
      right: 1px;
      height: 42px;
      width: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0 8px 8px 0;
      padding: 0;
      transition: color 120ms ease;
    }

    .toggle-pw:hover { color: var(--fg); }

    .toggle-pw:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      color: var(--accent);
    }

    .toggle-pw svg { display: block; pointer-events: none; }

    .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      color: var(--fg);
    }

    .remember input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .remember input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }

    a.forgot {
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-radius: 4px;
      padding: 2px 0;
      transition: color 120ms ease;
    }

    a.forgot:hover {
      color: var(--accent-hover);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    a.forgot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      color: var(--accent-hover);
    }

    .error {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-fg);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .error svg { flex-shrink: 0; margin-top: 1px; }

    button.signin {
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background-color 120ms ease, box-shadow 120ms ease, transform 80ms ease;
    }

    button.signin:hover { background: var(--accent-hover); }

    button.signin:active {
      background: var(--accent-press);
      transform: translateY(0.5px);
    }

    button.signin:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    form:has(input#email:placeholder-shown):has(input#password:placeholder-shown) button.signin {
      background: var(--disabled);
      cursor: not-allowed;
    }

    form:has(input#email:placeholder-shown):has(input#password:placeholder-shown) button.signin:hover {
      background: var(--disabled);
    }

    form:has(input#email:placeholder-shown):has(input#password:placeholder-shown) button.signin:active {
      transform: none;
    }

    .footer {
      margin-top: 24px;
      max-width: 480px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 500;
      transition: color 120ms ease;
    }

    .footer a:hover { color: var(--fg); }

    .footer a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      color: var(--accent-hover);
      border-radius: 2px;
    }

    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      .card { padding: 24px; }
      h1.app-name { font-size: 24px;

<div class="modal-container">
  <!-- Backdrop -->
  <div class="modal-backdrop" (click)="handleClose()"></div>
  
  <!-- Modal -->
  <div class="modal-content animate-fade-in">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="font-display text-xl font-semibold text-dark-50">Add New Agent</h2>
      <button
        (click)="handleClose()"
        class="close-btn"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form (submit)="handleSubmit(); $event.preventDefault()" class="modal-form">
      <!-- Error -->
      @if (error()) {
        <div class="error-banner">
          {{ error() }}
        </div>
      }

      <!-- ID -->
      <div class="form-group">
        <label class="form-label">
          ID <span class="text-accent-rose">*</span>
        </label>
        <input
          type="text"
          [value]="id()"
          (input)="onIdChange($event)"
          placeholder="my-agent"
          class="form-input"
        />
        <p class="form-hint">Lowercase letters, numbers, hyphens, underscores</p>
      </div>

      <!-- Name -->
      <div class="form-group">
        <label class="form-label">
          Name <span class="text-accent-rose">*</span>
        </label>
        <input
          type="text"
          [value]="name()"
          (input)="onNameChange($event)"
          placeholder="My Agent"
          class="form-input"
        />
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea
          [value]="description()"
          (input)="onDescriptionChange($event)"
          placeholder="What does this agent do?"
          rows="2"
          class="form-textarea"
        ></textarea>
      </div>

      <!-- Icon -->
      <div class="form-group">
        <label class="form-label">Icon</label>
        <div class="icon-grid">
          @for (iconOption of iconOptions; track iconOption) {
            <button
              type="button"
              (click)="onIconClick(iconOption)"
              [class.icon-btn]="true"
              [class.selected]="icon() === iconOption"
            >
              {{ iconOption }}
            </button>
          }
        </div>
      </div>

      <!-- Color -->
      <div class="form-group">
        <label class="form-label">Color</label>
        <div class="color-grid">
          @for (colorOption of colorOptions; track colorOption.value) {
            <button
              type="button"
              (click)="onColorClick(colorOption)"
              [class.color-btn]="true"
              [style.background-color]="colorOption.hex + '20'"
              [style.color]="colorOption.hex"
              [class.selected]="color() === colorOption.value"
              [style.--ring-color]="color() === colorOption.value ? colorOption.hex : 'transparent'"
            >
              {{ colorOption.label }}
            </button>
          }
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button
          type="button"
          (click)="handleClose()"
          class="cancel-btn"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="isSubmitDisabled()"
          class="submit-btn"
        >
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          }
          Create Agent
        </button>
      </div>
    </form>
  </div>
</div>

<div class="agent-selector animate-fade-in">
  <div class="text-center mb-8">
    <h1 class="font-display text-4xl font-bold text-dark-50 mb-2 tracking-tight">
      Select an Agent
    </h1>
    <p class="text-dark-400 font-body">
      Choose an agent to start a new conversation
    </p>
  </div>

  <!-- Mother Agent - Special System Button -->
  <div class="mb-6">
    <button
      (click)="onStartMother()"
      class="w-full p-4 rounded-2xl border-2 border-dashed border-accent-violet/50 bg-gradient-to-r from-accent-violet/10 to-accent-cyan/10
             hover:border-accent-violet hover:from-accent-violet/20 hover:to-accent-cyan/20 transition-all duration-300
             flex items-center gap-4 group"
    >
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-accent-violet to-accent-cyan flex items-center justify-center flex-shrink-0">
        <span class="text-2xl">🧬</span>
      </div>
      <div class="flex-1 text-left">
        <div class="font-display text-lg font-semibold text-dark-100 group-hover:text-white transition-colors">
          Mother — Create New Agent
        </div>
        <p class="text-dark-400 text-sm">
          Quickly create, modify, or delete agents through guided conversation
        </p>
      </div>
      <svg class="w-5 h-5 text-dark-400 group-hover:text-accent-violet group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    @for (agent of filteredAgents(); track agent.id) {
      <button
        (click)="onSelect(agent)"
        [class.agent-card]="true"
        [class.selected]="selectedAgent?.id === agent.id"
        [style.border-color]="selectedAgent?.id === agent.id ? getAgentColor(agent) : null"
        [style.background-color]="selectedAgent?.id === agent.id ? getAgentColor(agent) + '15' : null"
      >
        <div class="flex items-center gap-3 mb-3">
          <span class="text-3xl">{{ agent.icon }}</span>
          <span 
            class="font-display text-xl font-semibold"
            [style.color]="getAgentColor(agent)"
          >
            {{ agent.name }}
          </span>
        </div>
        <p class="text-dark-400 text-sm leading-relaxed">
          {{ agent.description }}
        </p>
        
        <!-- Selection indicator -->
        @if (selectedAgent?.id === agent.id) {
          <div 
            class="absolute top-3 right-3 w-3 h-3 rounded-full animate-pulse-subtle" 
            [style.background-color]="getAgentColor(agent)"
          ></div>
        }

        <!-- Delete button -->
        <button
          (click)="onDeleteAgent(agent, $event)"
          class="absolute bottom-3 right-3 p-1.5 rounded-lg bg-dark-900/80 text-dark-500 
                 opacity-0 group-hover:opacity-100 transition-opacity
                 hover:bg-accent-rose/20 hover:text-accent-rose delete-btn"
          title="Delete agent"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </button>
    }
    
    <!-- Add new agent card -->
    <button
      (click)="openAddModal()"
      class="p-6 rounded-2xl border-2 border-dashed border-dark-600 bg-dark-800/30
             hover:border-dark-500 hover:bg-dark-800/50 transition-all duration-300
             flex flex-col items-center justify-center gap-2 text-dark-400
             hover:text-dark-300 add-card"
    >
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span class="font-display font-medium">Add New Agent</span>
    </button>
  </div>

  <div class="flex justify-center gap-4">
    @if (hasInstances) {
      <button
        (click)="onContinueInstance('latest')"
        class="px-6 py-4 rounded-xl font-display font-semibold text-lg
               bg-dark-700 text-dark-200 border border-dark-600
               hover:bg-dark-600 hover:border-dark-500 transition-all duration-300"
      >
        Continue Instance
      </button>
    }
    <button
      (click)="onCreateInstance()"
      [disabled]="!selectedAgent || isLoading"
      [class.start-button]="selectedAgent"
      [class.disabled]="!selectedAgent || isLoading"
      [style.background-color]="selectedAgent ? activeColor() : null"
      [style.box-shadow]="selectedAgent ? '0 10px 40px -10px ' + activeColor() + '50' : null"
    >
      @if (isLoading) {
        <span class="flex items-center gap-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Creating Instance...
        </span>
      } @else {
        Start New Chat
      }
    </button>
  </div>
</div>

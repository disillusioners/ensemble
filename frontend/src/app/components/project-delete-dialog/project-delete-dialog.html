<div class="delete-dialog">
  <h2 mat-dialog-title>Delete Project</h2>

  <mat-dialog-content>
    <p class="warning-message">
      Are you sure you want to delete <strong>{{ project.name }}</strong>?
    </p>
    <p class="consequence">
      This action cannot be undone. All project data including queues, jobs, and related instances will be permanently removed.
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      (click)="handleCancel()"
      [disabled]="isDeleting()"
    >
      Cancel
    </button>
    <button
      mat-flat-button
      color="warn"
      (click)="handleDelete()"
      [disabled]="isDeleting()"
    >
      @if (isDeleting()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        Delete
      }
    </button>
  </mat-dialog-actions>
</div>

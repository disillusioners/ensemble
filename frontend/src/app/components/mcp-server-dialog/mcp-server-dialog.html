<div class="modal-container">
  <!-- Backdrop -->
  <div class="modal-backdrop"></div>

  <!-- Modal -->
  <div class="modal-content animate-fade-in">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="font-display text-xl font-semibold text-dark-50">
        @if (isEditMode()) {
          Edit MCP Server
        } @else {
          Add MCP Server
        }
      </h2>
      <button (click)="handleClose()" class="close-btn">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form (submit)="handleSubmit(); $event.preventDefault()" class="modal-form">
      <!-- Error -->
      @if (error()) {
        <div class="error-banner">
          {{ error() }}
        </div>
      }

      <!-- Name -->
      <div class="form-group">
        <label class="form-label">
          Name <span class="text-accent-rose">*</span>
        </label>
        <input
          type="text"
          [value]="name()"
          (input)="onNameChange($event)"
          placeholder="My MCP Server"
          class="form-input"
        />
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea
          [value]="description()"
          (input)="onDescriptionChange($event)"
          placeholder="Optional description of what this MCP server does"
          rows="2"
          class="form-textarea"
        ></textarea>
      </div>

      <!-- Config -->
      <div class="form-group">
        <label class="form-label">Configuration (JSON)</label>
        <textarea
          [value]="configJson()"
          (input)="onConfigJsonChange($event)"
          placeholder='{"command": "npx", "args": ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]}'
          rows="4"
          class="form-textarea mono"
          [class.has-error]="configJsonError()"
        ></textarea>
        <p class="form-hint" [class.error]="configJsonError()">
          @if (configJsonError()) {
            {{ configJsonError() }}
          } @else {
            Server configuration in JSON format (command, args, env, etc.)
          }
        </p>
      </div>

      <!-- Active Toggle -->
      <div class="form-group">
        <label class="toggle-label">
          <span>Active</span>
          <input
            type="checkbox"
            [checked]="isActive()"
            (change)="onIsActiveChange($event)"
            class="toggle-input"
          />
          <span class="toggle-switch"></span>
        </label>
        <p class="form-hint">Enable the server to make it available to agents</p>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" (click)="handleClose()" class="cancel-btn">
          Cancel
        </button>
        <button type="submit" [disabled]="isSubmitDisabled()" class="submit-btn">
          @if (isEditMode()) {
            Save Changes
          } @else {
            Create Server
          }
        </button>
      </div>
    </form>
  </div>
</div>

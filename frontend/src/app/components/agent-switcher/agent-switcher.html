<div class="agent-switcher-container">
  <!-- Dropdown trigger button -->
  <button
    class="dropdown-trigger"
    [class.active]="isOpen()"
    [style.--active-color]="activeColor"
    (click)="toggleDropdown()"
  >
    <!-- Agent icon -->
    <div 
      class="agent-icon"
      [style.background-color]="activeColor + '20'"
    >
      {{ selectedAgent?.icon || '🤖' }}
    </div>
    
    <!-- Agent name -->
    <span class="agent-name">
      {{ selectedAgent?.name || 'Select Agent' }}
    </span>
    
    <!-- Chevron icon -->
    <mat-icon class="chevron" [class.rotated]="isOpen()">
      expand_more
    </mat-icon>
  </button>

  <!-- Dropdown menu -->
  @if (isOpen()) {
    <div class="dropdown-menu">
      <div class="menu-content">
        @for (agent of agents; track agent.id) {
          <button
            class="menu-item"
            [class.selected]="selectedAgent?.id === agent.id"
            [style.--item-color]="getAgentColor(agent)"
            (click)="selectAgent(agent)"
          >
            <!-- Agent icon -->
            <div 
              class="item-icon"
              [style.background-color]="getAgentColor(agent) + '20'"
            >
              <span>{{ agent.icon }}</span>
            </div>
            
            <!-- Agent info -->
            <div class="item-info">
              <div 
                class="item-name"
                [style.color]="selectedAgent?.id === agent.id ? getAgentColor(agent) : ''"
              >
                {{ agent.name }}
              </div>
              <div class="item-description">
                {{ agent.description }}
              </div>
            </div>

            <!-- Selection indicator -->
            @if (selectedAgent?.id === agent.id) {
              <mat-icon class="check-icon" [style.color]="getAgentColor(agent)">
                check
              </mat-icon>
            }
          </button>
        }
      </div>

      <!-- Footer hint -->
      <div class="menu-footer">
        <p>Switch to change agent for next session</p>
      </div>
    </div>
  }
</div>

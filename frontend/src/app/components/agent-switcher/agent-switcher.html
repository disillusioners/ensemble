<div class="agent-switcher-container">
  <!-- Dropdown trigger button -->
  <button
    #triggerButton
    class="dropdown-trigger"
    [class.active]="isOpen()"
    [style.--active-color]="activeColor"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-controls]="'agent-dropdown-menu'"
    [attr.aria-activedescendant]="isOpen() ? activeDescendant : null"
    (click)="toggleDropdown()"
    (keydown)="onTriggerKeydown($event)"
  >
    <!-- Agent icon -->
    <div 
      class="agent-icon"
      [style.background-color]="activeColor + '20'"
    >
      {{ selectedAgent()?.icon || '🤖' }}
    </div>
    
    <!-- Agent name -->
    <span class="agent-name">
      {{ selectedAgent()?.name || 'Select Agent' }}
    </span>
    
    <!-- Chevron icon -->
    <mat-icon class="chevron" [class.rotated]="isOpen()">
      expand_more
    </mat-icon>
  </button>

  <!-- Dropdown menu -->
  @if (isOpen()) {
    <div 
      #dropdownMenu
      class="dropdown-menu"
    >
      <div class="menu-search">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Search agents..."
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          (keydown)="onSearchKeydown($event)"
          role="searchbox"
          aria-label="Search agents"
          aria-controls="agent-dropdown-menu"
          [attr.aria-activedescendant]="activeDescendant || null"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div
        id="agent-dropdown-menu"
        class="menu-content"
        role="listbox"
        [attr.aria-label]="'Select an agent'"
        [attr.aria-activedescendant]="activeDescendant || null"
        tabindex="-1"
        (focus)="onMenuFocus()"
      >
        <!-- Recent agents section (shown above the full list) -->
        @if (recentAgents().length > 0) {
          <div class="recent-section" role="group" aria-label="Recent agents">
            <div class="recent-header">RECENT</div>
            <!-- Recent items: same .menu-item markup, click-only (keyboard nav
                 operates on filteredAgents below) -->
            @for (agent of recentAgents(); track agent.id) {
              <button
                class="menu-item recent-item"
                [class.selected]="selectedAgent()?.id === agent.id"
                [style.--item-color]="getAgentColor(agent)"
                [attr.role]="'option'"
                [attr.aria-selected]="selectedAgent()?.id === agent.id"
                [attr.aria-label]="agent.name + ': ' + agent.description"
                tabindex="-1"
                (click)="selectAgent(agent)"
              >
                <!-- Agent icon -->
                <div
                  class="item-icon"
                  [style.background-color]="getAgentColor(agent) + '20'"
                >
                  <span>{{ agent.icon }}</span>
                </div>

                <!-- Agent info -->
                <div class="item-info">
                  <div
                    class="item-name"
                    [style.color]="selectedAgent()?.id === agent.id ? getAgentColor(agent) : ''"
                  >
                    {{ agent.name }}
                  </div>
                  <div class="item-description">
                    {{ agent.description }}
                  </div>
                </div>

                <!-- Selection indicator -->
                @if (selectedAgent()?.id === agent.id) {
                  <mat-icon class="check-icon" [style.color]="getAgentColor(agent)">
                    check
                  </mat-icon>
                }
              </button>
            }
          </div>
          <div class="recent-divider"></div>
        }

        @for (agent of filteredAgents(); track agent.id; let i = $index) {
          <button
            #menuItem
            class="menu-item"
            [class.selected]="selectedAgent()?.id === agent.id"
            [class.focused]="focusedAgentId === agent.id"
            [style.--item-color]="getAgentColor(agent)"
            [attr.role]="'option'"
            [attr.id]="'agent-option-' + agent.id"
            [attr.aria-selected]="selectedAgent()?.id === agent.id"
            [attr.aria-label]="agent.name + ': ' + agent.description"
            [tabindex]="focusedAgentId === agent.id ? '0' : '-1'"
            (click)="selectAgent(agent)"
            (keydown)="onOptionKeydown($event, agent)"
            (mouseenter)="onOptionMouseEnter(i)"
            (focus)="onOptionFocus(i)"
          >
            <!-- Agent icon -->
            <div
              class="item-icon"
              [style.background-color]="getAgentColor(agent) + '20'"
            >
              <span>{{ agent.icon }}</span>
            </div>

            <!-- Agent info -->
            <div class="item-info">
              <div
                class="item-name"
                [style.color]="selectedAgent()?.id === agent.id ? getAgentColor(agent) : ''"
              >
                {{ agent.name }}
              </div>
              <div class="item-description">
                {{ agent.description }}
              </div>
            </div>

            <!-- Selection indicator -->
            @if (selectedAgent()?.id === agent.id) {
              <mat-icon class="check-icon" [style.color]="getAgentColor(agent)">
                check
              </mat-icon>
            }
          </button>
        }

        @if (filteredAgents().length === 0) {
          <div class="menu-empty" role="status">
            <p>No agents found</p>
          </div>
        }
      </div>

      <!-- Footer hint -->
      <div class="menu-footer">
        <p>Switch to change agent for next session</p>
      </div>
    </div>
  }
</div>

<div class="home-container">
  <div class="home-content">
    @if (isLoading()) {
      <div class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <app-agent-selector
        [agents]="agents()"
        [selectedAgent]="selectedAgent()"
        [hasInstances]="hasInstances()"
         [isLoading]="isLoading()"
         [defaultVersions]="defaultAgentVersions()"
         (selectAgent)="onSelectAgent($event)"
         (versionChange)="onVersionChange($event)"

        (createInstance)="onCreateInstance($event)"
        (continueInstance)="onContinueInstance($event)"
        (addAgent)="onAddAgent($event)"
        (deleteAgent)="onDeleteAgent($event)"
        (startMother)="onStartMother()"
        (quickCreateInstance)="onQuickCreateInstance($event)"
        (viewInstances)="onViewInstances()"
      ></app-agent-selector>
    }
  </div>
</div>

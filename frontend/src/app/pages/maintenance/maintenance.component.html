<div class="maintenance-container">
  <header class="maintenance-header">
    <h1>Maintenance</h1>
    <p class="maintenance-subtitle">Operator controls for daemon maintenance</p>
  </header>

  <div class="maintenance-tabs-host">
    <mat-tab-group>
      @for (section of sections; track section.id) {
        <mat-tab
          [label]="section.label"
          [disabled]="section.disabled ?? false"
          [matTooltip]="section.disabled ? 'Coming soon' : null"
        >
          <ng-container *ngComponentOutlet="section.component"></ng-container>
        </mat-tab>
      }
    </mat-tab-group>
  </div>
</div>

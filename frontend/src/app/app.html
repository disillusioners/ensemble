<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <a routerLink="/" class="logo-link">
        <div class="logo">
          <span class="logo-text">AC</span>
        </div>
        <h1 class="app-title">Agents Ensemble</h1>
      </a>
      <nav class="header-nav">
        <a routerLink="/instances" routerLinkActive="active" class="nav-link">Instances</a>
        <a routerLink="/sources" routerLinkActive="active" class="nav-link">Sources</a>
        <a routerLink="/schedules" routerLinkActive="active" class="nav-link">Schedules</a>
        <a routerLink="/jobs" routerLinkActive="active" class="nav-link">Jobs</a>
        <a routerLink="/skills" routerLinkActive="active" class="nav-link">Skills</a>
        @if (planeEnabled()) {
          <a routerLink="/plan" routerLinkActive="active" class="nav-link">Plan</a>
        }
      </nav>
    </div>
    
    <div class="header-right">
      <app-job-queue-indicator></app-job-queue-indicator>
      <app-notification-bell></app-notification-bell>
      <button mat-icon-button [matMenuTriggerFor]="settingsMenu" class="gear-button" aria-label="Settings menu">
        <mat-icon>settings</mat-icon>
      </button>
      <mat-menu #settingsMenu="matMenu" matMenuClass="settings-menu">
        @for (item of settingsMenuItems(); track item.route) {
          <a mat-menu-item [routerLink]="item.route">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </mat-menu>
      @if (health()) {
        <div class="health-status">
          <span 
            class="status-dot" 
            [class.healthy]="health()!.status === 'healthy'"
            [class.unhealthy]="health()!.status !== 'healthy'"
          ></span>
          <span class="version">v{{ health()!.version }}</span>
        </div>
      }
      @if (isStreaming()) {
        <div class="streaming-indicator">
          <span class="live-dot"></span>
          <span class="live-text">Live</span>
        </div>
      }
    </div>
  </header>

  <!-- Main content -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Plane iframe — always mounted, display-toggled for caching.
       Stays alive across route changes so iframe state is preserved. -->
  @if (planeEnabled()) {
    <div
      class="plane-overlay"
      [style.display]="isPlanRoute() ? 'flex' : 'none'"
    >
      <button class="plane-overlay-close" mat-icon-button (click)="closePlan()">
        <mat-icon>close</mat-icon>
      </button>
      <app-plane-viewer [url]="planeUrl()"></app-plane-viewer>
    </div>
  }

  <!-- Global workspace overlay. Always mounted, display-toggled for
       caching. The `[visible]` input lets the workspace component
       disconnect SSE and skip keyboard handling while hidden; the
       `[style.display]` binding controls actual layout. The element
       is rendered at the App root so the Alt+` hotkey works from any
       route and the editor cache survives navigation. -->
  <app-workspace
    [projectId]="workspaceOverlayService.workspaceProjectId() || ''"
    [visible]="workspaceOverlayService.showWorkspace()"
    [style.display]="workspaceOverlayService.showWorkspace() ? 'flex' : 'none'"
    (hide)="workspaceOverlayService.hide()"
  ></app-workspace>
</div>

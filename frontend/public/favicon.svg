<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="agents-ensemble">
  <title>agents-ensemble</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </radialGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Background tile (rounded square; matches app body bg #0f172a family) -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Connection lines: outer agent nodes -> central ensemble hub -->
  <g stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="16" y1="7"   x2="16" y2="17"/>
    <line x1="7.5" y1="22" x2="16" y2="17"/>
    <line x1="24.5" y1="22" x2="16" y2="17"/>
  </g>

  <!-- Three outer agent nodes -->
  <circle cx="16"   cy="7"  r="4" fill="url(#node)"/>
  <circle cx="7.5"  cy="22" r="4" fill="url(#node)"/>
  <circle cx="24.5" cy="22" r="4" fill="url(#node)"/>

  <!-- Central ensemble hub (the conductor) -->
  <circle cx="16" cy="17" r="5" fill="url(#hub)"/>
</svg>
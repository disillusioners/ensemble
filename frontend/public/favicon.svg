<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Connection lines between nodes -->
  <line x1="16" y1="8" x2="8" y2="24" stroke="url(#link)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="8" x2="24" y2="24" stroke="url(#link)" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="24" y2="24" stroke="url(#link)" stroke-width="2" stroke-linecap="round"/>
  <!-- Three agent nodes -->
  <circle cx="16" cy="8" r="4" fill="url(#node)"/>
  <circle cx="8" cy="24" r="4" fill="url(#node)"/>
  <circle cx="24" cy="24" r="4" fill="url(#node)"/>
  <!-- Center hub -->
  <circle cx="16" cy="18" r="2.5" fill="#a78bfa" opacity="0.8"/>
</svg>

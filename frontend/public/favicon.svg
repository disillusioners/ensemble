<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="agents-ensemble">
  <title>agents-ensemble</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </radialGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background tile (rounded square; matches app body bg #0f172a family) -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Connection lines: outer agent nodes -> central ensemble hub -->
  <g stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="16"     y1="7"    x2="16" y2="18"/>
    <line x1="6.474"  y1="23.5" x2="16" y2="18"/>
    <line x1="25.526" y1="23.5" x2="16" y2="18"/>
  </g>

  <!-- Three outer agent nodes (exact 120° spacing around hub center) -->
  <circle cx="16"     cy="7"    r="3.8" fill="url(#node)"/>
  <circle cx="6.474"  cy="23.5" r="3.8" fill="url(#node)"/>
  <circle cx="25.526" cy="23.5" r="3.8" fill="url(#node)"/>

  <!-- Central ensemble hub (the conductor) -->
  <circle cx="16" cy="18" r="4.6" fill="url(#hub)"/>
</svg>

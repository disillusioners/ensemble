# Ensemble Daemon Configuration
# Copy this file and modify as needed

# LLM Configuration
llm:
  base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:-gpt-4}
  model_title: ${OPENAI_MODEL_TITLE:-}  # Optional separate model for title generation
  temperature: 0.7

# Server Configuration  
daemon:
  host: ${HOST:-0.0.0.0}
  port: ${PORT:-8088}

# Instance Limits
limits:
  max_instances: 100
  max_children_per_instance: 50
  instance_timeout_minutes: 60
  message_rate_limit: 60
  graph_recursion_limit: 200

# Persistence Settings
persistence:
  db_path: ./data/instances.db
  checkpoint_interval: 1
  checkpoint_ttl_hours: 168
  checkpoint_cleanup_interval: 24
  checkpoint_max_count: 1000

# Agents Directory
agents:
  directory: ./agents

# Message Queue Settings
queue:
  max_queue_size: 100
  message_timeout_seconds: 3600  # 1 hour for long tasks
  max_retries: 5
  watchdog_check_interval_seconds: 30
  cleanup_completed_age_hours: 24
  circuit_breaker_failure_threshold: 5
  circuit_breaker_recovery_timeout_seconds: 300
  llm_max_retries: 7
  llm_retry_delay_seconds: 3.0
  llm_retry_exponential_base: 2.0

# Worker Pool and Background Services
services:
  worker_poll_interval: 0.5  # How often workers poll for tasks (seconds)
  stale_task_recovery_interval: 60  # How often to check for stale tasks (seconds)
  # Task timeout and retry
  task_timeout_minutes: 15  # Max task execution time (0 = no timeout)
  max_task_retries: 3  # Max retry attempts (0 = no retry)
  task_retry_backoff_base: 60  # Base backoff in seconds (1 min)
  task_retry_backoff_max: 3600  # Max backoff in seconds (1 hour)
  stale_task_cancel_grace_seconds: 10  # Grace period for worker shutdown

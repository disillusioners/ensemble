# Ensemble Daemon Configuration
# Copy this file and modify as needed

# LLM Configuration
llm:
  base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  # Optional HA fallback endpoint — same proxy backend in a different
  # datacenter (same API key, model names, API surface). When unset
  # (default), behavior is identical to the pre-HA system: only
  # ``base_url`` is used. When set, transient / timeout / empty-choices
  # failures on the primary trigger a one-shot swap to this URL within
  # the same invoke cycle. Sticky-on-success — after a successful
  # failover the client stays on backup (both endpoints serve the same
  # backend); the controller returns to primary after the NEXT invoke's
  # first attempt completes, regardless of whether that attempt succeeds
  # or fails on backup (see FailoverController docstring for rationale).
  # Override via OPENAI_BASE_URL_BACKUP env var.
  base_url_backup: ${OPENAI_BASE_URL_BACKUP:-}
  api_key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:-gpt-4}
  model_title: ${OPENAI_MODEL_TITLE:-}  # Optional separate model for title generation
  model_keywords: ${OPENAI_MODEL_KEYWORDS:-}  # Optional. Set to "quick" to mirror the explorer agent's llm_model.
  model_vision: ${OPENAI_MODEL_VISION:-}  # Optional vision-capable model for image processing (e.g., gpt-4o)
  temperature: 0.7
  request_timeout: 610  # HTTP client timeout per LLM call (seconds). Counts
                        # toward task_timeout_minutes budget for each retry.

  # Models for which reasoning_content echo is DISABLED: reasoning_content
  # from a previous turn is echoed back in subsequent assistant messages for
  # every model EXCEPT those whose name case-insensitively substring-matches
  # an entry here (e.g. providers that reject the field with a 400). Empty
  # default = all models echo.
  # Override via OPENAI_REASONING_ECHO_DISABLED_MODELS env var (comma-separated
  # or JSON array). Default: [].
  reasoning_echo_disabled_models: ${OPENAI_REASONING_ECHO_DISABLED_MODELS:-}

  # Stream chat completions on the wire (Cloudflare ~125s 524 fix).
  # When True (default), every LangChain ChatOpenAI constructed via
  # daemon.graph.clean_llm_config sends `stream: True` to the backend so
  # chunked bytes flow back through the Cloudflare proxy before its anycast
  # read timeout can kill a silent POST with zero response. LangChain
  # invoke() aggregates chunks into the same AIMessage; callers see
  # identical final results. Embedding calls are never streamed. Raw-SDK
  # chat sites are NOT yet wired for streaming (deferred).
  # Override via OPENAI_STREAMING env var (true / false). Default: true.
  streaming: ${OPENAI_STREAMING:-true}

  # Outbound X-LLMProxy-Buffer-Response: true request header on every
  # chat-completion request that carries the proxy identity headers
  # (x-proxy-app / x-proxy-interleaved-thinking). Asks the proxy to
  # buffer the response. Default true (header sent). Set false to omit
  # the header entirely — it is never sent with the literal value
  # "false" (a present-but-false header may be misread by the proxy).
  # Override via OPENAI_BUFFER_RESPONSE_HEADER env var (true / false).
  # Default: true.
  buffer_response_header: ${OPENAI_BUFFER_RESPONSE_HEADER:-true}

  # Models allowed as instance model overrides at spawn time. Case-insensitive
  # exact match against the override model name; a match against ANY entry
  # is sufficient. Empty list = all models allowed (no restriction).
  # Override via OPENAI_ALLOWED_MODELS env var (comma-separated or
  # JSON array). Default: ["agentic", "coding"].
  # Exact model names only — this is NOT a prefix or substring match.
  allowed_models: ${OPENAI_ALLOWED_MODELS:-agentic,coding}

# Server Configuration  
daemon:
  host: ${HOST:-0.0.0.0}
  port: ${PORT:-8088}

# Instance Limits
limits:
  max_instances: 100
  max_children_per_instance: 50
  instance_timeout_minutes: 60
  message_rate_limit: 60
  graph_recursion_limit: 300
  llm_concurrency: 10

# Persistence Settings
persistence:
  db_path: ./data/instances.db
  # checkpointer_db_path was removed; the checkpointer DB path lives in
  # ensemble.json (EnsembleConfig.sqlite.checkpoints_db).
  checkpoint_interval: 1
  checkpoint_ttl_hours: 168
  checkpoint_cleanup_interval: 24
  max_instance_history: 1000

# Agents Directory
agents:
  directory: ./agents

# Message Queue Settings
queue:
  # Safe backlog clear on startup: discards only PENDING tasks + their
  # messages; preserves RUNNING (in-flight) and PAUSED (resumable) work
  # so paused instances still block system_defer_queue and remain
  # resumable across a restart.
  discard_on_startup: false
  # LLM retry settings per error category:
  #
  # Transient errors (500/502/503/429 rate limit, connection errors):
  #   These fail fast (response in seconds), so more retries fit in the time budget.
  #   10 attempts × ~5s per failed request ≈ 17 min total retry time.
  llm_retry_transient_attempts: 10
  #
  # Timeout errors (request_timeout exceeded):
  #   Each timeout attempt costs up to request_timeout (660s = 11 min).
  #   3 attempts × 660s ≈ 33 min, within the 45 min task_timeout budget.
  #   More retries would exceed the task timeout and waste resources.
  llm_retry_timeout_attempts: 3
  #
  # Non-retryable errors (401 auth, 403 forbidden, 400 bad request):
  #   These fail immediately with no retries — retrying won't fix them.
  #
  # Non-status transient-channel pattern matching
  # (docs/plans/transient-channel-retry-widening.md):
  #   NOTE: entries below are operator overrides of the built-in
  #   corpus-derived defaults — REMOVING a key reverts to the defaults;
  #   disabling requires an explicit empty/trimmed list.
  #   allowlist: bare openai.APIError messages treated as transient
  #     (timeout-body patterns below route to the 3-attempt timeout
  #     budget; other hits to the 10-attempt transient budget).
  #     Corpus: 'All models rate limited' — 21 events 2026-08-19→26,
  #     instance deaths on attempt 1 of 10 (bug doc RC1/C1).
  transient_apierror_allowlist: ['all models rate limited', 'context deadline exceeded']
  #   Timeout-body subset of the allowlist — relayed upstream timeouts
  #     ('context deadline exceeded', 2 events, bug doc C1). Each
  #     attempt can cost the upstream's full timeout, so they consume
  #     the 3-attempt timeout budget, not the 10-attempt transient one.
  #     Validated at load: must be a subset of the allowlist above.
  transient_apierror_timeout_patterns: ['context deadline exceeded']
  #   blocklist: mandatory precedence over the allowlist — enforced on
  #     BOTH the bare-APIError and the ValueError channels (quota /
  #     bad-params shapes stay terminal even inside 200-body proxy
  #     dicts). Corpus: 'Token Plan usage limit reached' (2056) shares
  #     wording families with allowlist entries. Auth shapes are
  #     unreachable here by design — auth errors arrive as
  #     APIStatusError and are caught at the status branch — so they
  #     are NOT listed.
  transient_apierror_blocklist: ['token plan', 'usage limit', 'invalid params']
  #   ValueError-body patterns (200-body proxy errors, empty SSE
  #     stream). Corpus: 'No generations found in stream.' (4 events,
  #     C4) and ultimate_model_retry_exhausted dict bodies (8 events,
  #     C2). The latter is proxy-dependent: disable it by setting an
  #     explicit trimmed list once the proxy's ultimate-routing
  #     transparency update ships (bug doc RC2) — config-removable
  #     without a deploy.
  transient_valueerror_patterns: ['no generations found', 'ultimate_model_retry_exhausted']
  #   C3 kill-switch: httpx.RemoteProtocolError (peer closed mid-body,
  #   'incomplete chunked read', 7 events) retryable. Flip to false to
  #   stop a broken-endpoint retry loop without a redeploy.
  transient_remote_protocol_retryable: true
  # Quota-window shapes typed as UsageLimitError
  # (docs/plans/usage-limit-deferral-path.md): terminal at L1, the
  # dedicated deferral path (worker seam) owns recovery — anchor +
  # 6h deadline + fixed wake schedule (services.usage_limit_* below).
  #   MUST stay disjoint from bad-params shapes ('invalid params',
  #   corpus 2013) — validated at load. Empty list disables the typed
  #   wrapper (quota shapes revert to the untyped terminal re-raise).
  usage_limit_patterns: ['token plan', 'usage limit']

# Context Compaction Settings
compaction:
  enabled: true
  threshold: 0.80
  recent_message_window: 10
  min_recent_window: 3
  # Per-model context window overrides (substring match; longest key wins).
  # Takes priority over the built-in MODEL_CONTEXT_LIMITS registry, so you
  # can cap a smaller vision model (or any proxy-hosted variant) without
  # touching code. Example: the leader uses 'gpt-4o' (128k) but a vision
  # sub-agent uses 'gpt-4o-mini-vision' with a tighter 32k window.
  # context_window_default is the fallback when neither an override nor
  # the registry matches the active model. 0 = use built-in default (180k).
  context_window_default: 0
  context_window_overrides:
    "agentic": 600000
    "vision": 120000
  target_ratio: 0.40
  summarization_model: ""
  min_messages_before_compaction: 10
  summarization_chunk_threshold: 0.60

# Worker Pool and Background Services
services:
  # task_timeout_minutes: Task-level hard timeout. Must cover all LLM attempts
  #   AND the graph_timeout below. Set 5 min above graph_timeout so the
  #   CancellationToken path usually fires before the thread-side safety net.
  #   With 3 timeout retries (3 × 660s ≈ 33 min) + transient retry overhead
  #   (~40s) + headroom for long-running multi-phase tasks: 125 min total.
  task_timeout_minutes: 125
  max_task_retries: 3  # Max retry attempts (0 = no retry)
  task_retry_backoff_base: 60  # Base backoff in seconds (1 min)
  task_retry_backoff_max: 3600  # Max backoff in seconds (1 hour)
  # Grace period between request_cancel and force_cancel for stale tasks.
  #   30s gives a long-running graph time to flush its final checkpoint
  #   token before the recovery sweeper force-cancels and creates a retry.
  stale_task_cancel_grace_seconds: 30
  # Dedicated usage-limit deferral path
  # (docs/plans/usage-limit-deferral-path.md): quota-window errors
  # ('Token Plan usage limit reached', corpus 2056) defer on a fixed
  # schedule inside a 6h horizon instead of terminal-failing at L1.
  #   The window is the RETRY horizon, not a timeout — attempts still
  #   fail in seconds; patience lives between tasks.
  usage_limit_window_seconds: 21600  # 6h horizon from first sighting
  #   Wake schedule steps: 3m → 5m → 10m, then the 15m cap repeats
  #   until the deadline. Elapsed-derived from the persisted anchor —
  #   restarts resume the window, not restart it.
  usage_limit_retry_delays_seconds: [180, 300, 600, 900]
  #   Per-wake jitter (± fraction of the slot step; clamped to never
  #   schedule into the past) so a herd of quota-hit instances
  #   doesn't wake on identical slots.
  usage_limit_retry_jitter_fraction: 0.1
  # graph_timeout_minutes: Hard timeout for LangGraph execution (MainLoopBridge).
  #   This is the safety net if the graph hangs indefinitely. Bumped from
  #   55 to 120 min so long-running tasks (e.g. multi-phase refactors that
  #   spawn several explorer children and run dozens of LLM turns) can
  #   complete. If the safety net still fires within a few seconds of
  #   natural completion, worker_pool._handle_cancellation now detects the
  #   already-COMPLETED message and skips the retry, eliminating the
  #   orphan-retry chain. Set to 0 to disable.
  graph_timeout_minutes: 120

# Job System Settings
job_system:
  job_retry_scheduler_enabled: null  # null/empty = disabled. Set to true to enable background retry polling.

# Skill Evolution System Settings
# Field names mirror daemon/config.py:SkillEvolutionConfig exactly.
# Any env var listed in .env.example (SKILL_EVOLUTION_*) overrides these.
skill_evolution:
  # Embedding configuration (powers skill retrieval + dedupe)
  embedding_model: text-embedding-3-small
  embedding_dimensions: 1536
  embedding_api_key: null  # Falls back to llm.api_key if null
  embedding_base_url: null  # Falls back to llm.base_url if null

  # Evolution models
  analysis_model: null  # Cheap model for Tier 2 analysis. Falls back to main llm.model if null.
  evolution_model: null  # Model for Tier 3 evolution. Falls back to main llm.model if null.

  # A/B testing thresholds
  ab_sample_size: 10
  ab_min_difference: 0.15  # Loser must be at least 15% worse than the champion to swap.
  max_extensions: 3

  # Skill injection (search → inject into agent prompt)
  max_inject_skills: 2
  min_score_full_inject: 0.7
  min_score_low_match: 0.3  # Code default; raise to 0.4 for stricter low-match gating.
  bm25_top_k: 10
  llm_select_top_k: 5

  # Triggers (when the system scans metrics / runs evolution)
  default_task_count_threshold: 20  # Run metric scan every N tasks per skill.
  default_daily_scan_hour: 3  # Daily scan at 3 AM (0-23, server local time).
  metric_scan_interval_hours: 24.0  # How often the skill_metric_scan maintenance job runs.

  # Capture thresholds (skill content must reach these to be captured)
  capture_min_iterations: 5
  capture_min_duration_seconds: 60

# ─── Project Blueprint System ──────────────────────────────────
# Auto-rebuild is ON by default. Set to false to disable all
# automated triggers (scan every 5h off-peak, pending-queue processing).
# Manual triggers (UI button, API calls) always work regardless.
# 
# YAML values take priority over BLUEPRINT_* env vars.
# Use null to let env vars decide.
blueprint:
  auto_rebuild_enabled: true              # ON by default, set false or BLUEPRINT_AUTO_REBUILD_ENABLED=false to disable
  bm25_weight: 0.4                        # BM25 fusion weight
  vector_weight: 0.6                      # Vector cosine fusion weight
  match_threshold: 0.30                   # Minimum fusion score to inject
  max_results: 5                          # Max blueprints injected per turn
  matchable_statuses:                     # Which statuses are matchable
    - published
  # Doc Maintenance (Phase 4) — opt-in trust ladder for automated
  # doc-maintainer workers. Both default OFF; operators must explicitly
  # opt in to having a background agent write docs/comments and/or commit.
  # Set BLUEPRINT_DOC_MAINTENANCE_ENABLED=true to enable writes.
  # Set BLUEPRINT_DOC_MAINTENANCE_COMMIT_ENABLED=true to also enable
  # the atomic build-validation + git-commit step.
  # doc_maintenance_build_cmd: null        # Optional override (e.g., "make lint-docs")
  doc_maintenance_enabled: false
  doc_maintenance_commit_enabled: false
  doc_maintenance_build_cmd: null
  # Embedding config — null falls back to shared EMBEDDING_* env vars
  embedding_model: null
  embedding_dimensions: 1536
  embedding_base_url: null
  embedding_api_key: null

# VS Code Server Editor Configuration
vscode:
  allow_remote: false        # C1: default to localhost-only (code-server binds 127.0.0.1)
  binary_path: null           # null = auto-detect via PATH lookup (shutil.which)
  user_data_dir: null         # null = uses data/vscode-user-data
  extensions: []              # list of extension IDs to pre-install (e.g. ms-python.python)


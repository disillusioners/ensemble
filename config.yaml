# Ensemble Daemon Configuration
# Copy this file and modify as needed

# LLM Configuration
llm:
  base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:-gpt-4}
  model_title: ${OPENAI_MODEL_TITLE:-}  # Optional separate model for title generation
  model_vision: ${OPENAI_MODEL_VISION:-}  # Optional vision-capable model for image processing (e.g., gpt-4o)
  temperature: 0.7
  request_timeout: 660  # HTTP client timeout per LLM call (seconds). Counts
                        # toward task_timeout_minutes budget for each retry.

  # Models for which reasoning_content from a previous turn must be echoed
  # back in subsequent assistant messages. Case-insensitive substring match
  # against the model name. Required by DeepSeek's thinking-mode API for
  # tool-calling turns — see https://api-docs.deepseek.com/guides/thinking_mode
  # Override via OPENAI_REASONING_ECHO_MODELS env var (comma-separated or
  # JSON array). Default: ["deepseek"].
  reasoning_echo_models:
    - deepseek

# Server Configuration  
daemon:
  host: ${HOST:-0.0.0.0}
  port: ${PORT:-8088}

# Instance Limits
limits:
  max_instances: 100
  max_children_per_instance: 50
  instance_timeout_minutes: 60
  message_rate_limit: 60
  graph_recursion_limit: 300
  llm_concurrency: 10

# Persistence Settings
persistence:
  db_path: ./data/instances.db
  # checkpointer_db_path was removed; the checkpointer DB path lives in
  # ensemble.json (EnsembleConfig.sqlite.checkpoints_db).
  checkpoint_interval: 1
  checkpoint_ttl_hours: 168
  checkpoint_cleanup_interval: 24
  max_instance_history: 300

# Agents Directory
agents:
  directory: ./agents

# Message Queue Settings
queue:
  discard_on_startup: false
  # LLM retry settings per error category:
  #
  # Transient errors (500/502/503/429 rate limit, connection errors):
  #   These fail fast (response in seconds), so more retries fit in the time budget.
  #   10 attempts × ~5s per failed request ≈ 17 min total retry time.
  llm_retry_transient_attempts: 10
  #
  # Timeout errors (request_timeout exceeded):
  #   Each timeout attempt costs up to request_timeout (660s = 11 min).
  #   3 attempts × 660s ≈ 33 min, within the 45 min task_timeout budget.
  #   More retries would exceed the task timeout and waste resources.
  llm_retry_timeout_attempts: 3
  #
  # Non-retryable errors (401 auth, 403 forbidden, 400 bad request):
  #   These fail immediately with no retries — retrying won't fix them.

# Context Compaction Settings
compaction:
  enabled: true
  threshold: 0.80
  recent_message_window: 10
  min_recent_window: 3
  context_window_override: 0
  target_ratio: 0.40
  summarization_model: ""
  min_messages_before_compaction: 10
  summarization_chunk_threshold: 0.60

# Worker Pool and Background Services
services:
  # task_timeout_minutes: Task-level hard timeout. Must cover all LLM attempts.
  #   With 3 timeout retries (3 × 660s ≈ 33 min) + transient retry overhead (~40s):
  #   Total ≈ 34 min, well within the 60 min budget.
  task_timeout_minutes: 60
  max_task_retries: 3  # Max retry attempts (0 = no retry)
  task_retry_backoff_base: 60  # Base backoff in seconds (1 min)
  task_retry_backoff_max: 3600  # Max backoff in seconds (1 hour)
  stale_task_cancel_grace_seconds: 10  # Grace period for worker shutdown
  # graph_timeout_minutes: Hard timeout for LangGraph execution (MainLoopBridge).
  #   This is the safety net if the graph hangs indefinitely.
  #   Default: 55 min. Set to 0 to disable.
  graph_timeout_minutes: 55

# Job System Settings
job_system:
  job_retry_scheduler_enabled: null  # null/empty = disabled. Set to true to enable background retry polling.

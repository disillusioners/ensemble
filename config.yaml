# Ensemble Daemon Configuration
# Copy this file and modify as needed

# LLM Configuration
llm:
  base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:-gpt-4}
  model_title: ${OPENAI_MODEL_TITLE:-}  # Optional separate model for title generation
  temperature: 0.7

# Server Configuration  
daemon:
  host: ${HOST:-0.0.0.0}
  port: ${PORT:-8079}

# Session Limits
limits:
  max_sessions: 100
  max_children_per_session: 50
  session_timeout_minutes: 60
  message_rate_limit: 60
  graph_recursion_limit: 200

# Persistence Settings
persistence:
  db_path: ./data/sessions.db
  checkpoint_interval: 1
  checkpoint_ttl_hours: 168
  checkpoint_cleanup_interval: 24
  checkpoint_max_count: 1000

# Agents Directory
agents:
  directory: ./agents

# Message Queue Settings
queue:
  max_queue_size: 100
  message_timeout_seconds: 3600  # 1 hour for long tasks
  max_retries: 5
  watchdog_check_interval_seconds: 30
  cleanup_completed_age_hours: 24
  circuit_breaker_failure_threshold: 5
  circuit_breaker_recovery_timeout_seconds: 300
  llm_max_retries: 3
  llm_retry_delay_seconds: 10.0
  llm_retry_exponential_base: 2.0

# Context Compaction Settings
# Automatically summarizes old conversation history when context window fills up
compaction:
  enabled: true
  threshold: 0.80              # Trigger at 80% of context window
  recent_message_window: 10    # Keep last 10 boundary groups intact (not individual messages)
  min_recent_window: 3         # Never reduce below 3 groups, even under pressure
  target_ratio: 0.40           # Target 40% of context window after compaction
  min_messages_before_compaction: 10
  summarization_chunk_threshold: 0.60  # Chunk summarization if old messages > 60% of context
  # context_window_override: 0  # 0 = auto-detect from model name
  # summarization_model: ""     # Empty = use session model

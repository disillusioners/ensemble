schema_version: 1.0.3
plugin:
  name: opendesign
  license: Apache-2.0
  upstream:
    repo: https://github.com/nexu-io/open-design.git
    tag_pin_per_class:
      copy_freely: open-design-v0.24.1
      snapshot_with_drift_alarm: open-design-v0.24.1
  integration_path: B
  execution_mode: lifted-symbol
  lifted_symbol: task.od.generate
  entrypoint: adapter/entry.ts
  ipc_version: 1
copy_freely:
  paths:
  - copy_freely/design-systems/
  - copy_freely/design-templates/
  - copy_freely/craft/
  - copy_freely/prompt-templates/
  alarm_owner: plugin-opendesign-data
  escalation: block-promote-after-days
snapshot_with_drift_alarm:
  paths:
  - snapshot_with_drift_alarm/prompts/daemon/
  - snapshot_with_drift_alarm/prompts/contracts/
  - snapshot_with_drift_alarm/runtime/
  upstream_paths:
  - apps/daemon/src/prompts/
  - packages/contracts/src/prompts/
  - packages/contracts/src/runtime/
  alarm_owner: plugin-opendesign-prompts
  escalation: block-promote-after-days
  divergence_register:
  - id: 1
    files:
    - snapshot_with_drift_alarm/prompts/daemon/system.ts
    delta: "daemon system.ts is the full composer (~135KB); contracts mirror is the\
      \ exported subset (~74KB); upstream two-tree drift documented at od-resource-layer\
      \ \xA71.B"
    rationale: "Pre-registered divergence point: future sync will surface the upstream\
      \ delta; re-apply (port upstream changes into the Python Mode-P compose Provider\
      \ at slice \u2464 \u2014 provider reads contracts-mirror primary, daemon-copy\
      \ fallback per OQ7) or drop (decline the upstream change with a manifest rationale)"
    upstream_ref: od-resource-layer.md#1.B
    pinning_test: tests/unit/plugin_subsystem/test_snapshot_class_byte_fidelity.py::TestSnapshotClassByteFidelity::test_register_entry_1_daemon_system_two_tree_drift
    status: registered
  - id: 2
    files:
    - snapshot_with_drift_alarm/prompts/daemon/media-contract.ts
    delta: daemon media-contract.ts is the full module (~33KB); contracts mirror is
      the API subset (~9.8KB); upstream two-tree drift
    rationale: 'Pre-registered divergence point: media contract shell-out (image/video/audio)
      diverges; future sync will surface the upstream delta; re-apply or drop (Mode-P
      Provider reads contracts-mirror primary per OQ7)'
    upstream_ref: od-resource-layer.md#1.B
    pinning_test: tests/unit/plugin_subsystem/test_snapshot_class_byte_fidelity.py::TestSnapshotClassByteFidelity::test_register_entry_2_daemon_media_contract_two_tree_drift
    status: registered
  - id: 3
    files:
    - snapshot_with_drift_alarm/prompts/daemon/core-slim.ts
    delta: "daemon core-slim.ts (438 lines) has NO contracts mirror; the contracts\
      \ package cannot receive the slim charter (asymmetry documented at od-resource-layer\
      \ \xA71.B)"
    rationale: "Pre-registered asymmetry: core-slim lives daemon-only; OQ7 disposition\
      \ confirms the asymmetry \u2014 the Mode-P Provider reads the daemon copy directly\
      \ when no contracts mirror is available. Future sync will not surface a contracts-side\
      \ delta to track; this entry exists to mark the asymmetry so a future contributor\
      \ does not 'fix' it by adding a mirror"
    upstream_ref: od-resource-layer.md#1.B (core-slim contracts-mirror absence)
    pinning_test: tests/unit/plugin_subsystem/test_snapshot_class_byte_fidelity.py::TestSnapshotClassByteFidelity::test_register_entry_3_daemon_core_slim_contracts_mirror_absence
    status: registered
  - id: 4
    files:
    - snapshot_with_drift_alarm/prompts/daemon/directions.ts
    - snapshot_with_drift_alarm/prompts/daemon/discovery.ts
    - snapshot_with_drift_alarm/prompts/daemon/official-system.ts
    delta: "daemon/contracts two-tree drift documented at od-resource-layer \xA71.B;\
      \ per-file parity enforced by mirror tests only (not byte-fidelity)"
    rationale: "Pre-registered divergence points: 3 files where the daemon/contracts\
      \ two-tree drift is real; future sync will surface upstream deltas; re-apply\
      \ or drop per CON \xA72 rule"
    upstream_ref: od-resource-layer.md#1.B
    pinning_test: tests/unit/plugin_subsystem/test_snapshot_class_byte_fidelity.py::TestSnapshotClassByteFidelity::test_register_entry_4_three_files_two_tree_drift
    status: registered
  - id: 5
    files:
    - snapshot_with_drift_alarm/runtime/html-injection-points.ts
    - snapshot_with_drift_alarm/runtime/membership-concurrency-limit.ts
    - snapshot_with_drift_alarm/runtime/model-window-limit.ts
    - snapshot_with_drift_alarm/runtime/od-next-capability.ts
    - snapshot_with_drift_alarm/runtime/preview-build-focus.ts
    - snapshot_with_drift_alarm/runtime/preview-guards.ts
    - snapshot_with_drift_alarm/runtime/preview-observability.ts
    - snapshot_with_drift_alarm/runtime/preview-runtime-state.ts
    delta: "slice-\u2465 real same-tag pull (2026-10-07): +8/~0/-0 \u2014 the 8 upstream\
      \ packages/contracts/src/runtime/ files not vendored at \u2464 landed through\
      \ the sync-runner"
    rationale: "The pull IS the re-apply disposition (CON \xA72: re-apply or drop,\
      \ update the log either way). Files landed byte-faithful to the pin (gate bar\
      \ 1 green) and are hash-registered (HASHES 29\u219237, gate bar 2). Entry annotated\
      \ from the sync-emitted status=open to resolved by this operator disposition\
      \ \u2014 the sole-writer route (declare -> sync -> hash-register) completed\
      \ the runtime/ membership."
    upstream_ref: open-design-v0.23.0 packages/contracts/src/runtime/ (8 files, sync-runner
      real pull)
    pinning_test: tests/unit/plugin_subsystem/test_sync_runner.py::TestSnapshotClassDrift::test_drift_alarm_at_snapshot_with_drift_alarm
    status: resolved
  - id: 6
    files:
    - prompts/contracts/od-next-intent-resolution.ts
    - prompts/contracts/od-next-strategy.ts
    delta: 'upstream drift observed on open-design-v0.24.1: +1/~1/-0'
    rationale: "Snapshot pulled at sync time; divergence registered; re-apply or drop,\
      \ update the log either way (CON \xA72)"
    pinning_test: tests/unit/plugin_subsystem/test_sync_runner.py::TestSnapshotClassDrift::test_drift_alarm_at_snapshot_with_drift_alarm
    status: resolved
own_outright:
  paths:
  - own_outright/turn3_orchestration/
  - own_outright/lint/
  - own_outright/parse5_eof_gate/
  attribution:
  - path: turn3_orchestration/
    license_carried_from: Apache-2.0 open-design-mcp@0.16.1
    upstream_source: https://github.com/nano-step/open-design-mcp/blob/main/src/tools/compose-brief.js
    upstream_commit: 7766582f (vendored 2026-05-17; LICENSE preserved in own_outright/turn3_orchestration/LICENSE)
    rationale: "Apache-2.0 \xA74(d) \u2014 copy + attribution + state of changes;\
      \ the orchestration is pure formatting (string concatenation), re-expressed\
      \ in Python for the Mode-P Provider"
  - path: lint/
    license_carried_from: Apache-2.0 open-design
    upstream_source: https://github.com/nexu-io/open-design/blob/main/apps/daemon/src/lint-artifact.ts
    rationale: The 16-regex family is re-expressed from lint-artifact.ts heuristics;
      Apache-2.0 preserves the freedom to port and relicense as ours
ports:
  entries:
  - port_id: od.generate
    version: 1
    adapter_id: opendesign.generate.v1
    consumers:
    - designer.generate_draft
    - designer.regenerate_after_lint_fail
    - job.generate_mockup
    declared_in: daemon/plugin_subsystem/opendesign/ports.py
    capability_tags:
    - generation
    - design
    - long-running
    notes: Mode P (Python-native); inline finish_reason + usage visibility; completeness
      gates INSIDE (the load-bearing fix for the 2026-10-06 2/2 live failure)
  - port_id: od.compose_brief
    version: 1
    adapter_id: opendesign.compose_brief.v1
    consumers:
    - designer.compose_brief
    - designer.compose_brief_per_page
    declared_in: daemon/plugin_subsystem/opendesign/ports.py
    capability_tags:
    - brief-composition
    - pure-function
    notes: Turn-3 pure formatter (no network); ported from open-design-mcp@0.16.1
      (Apache-2.0; OQ4 verified; see own_outright attribution above)
  - port_id: od.save
    version: 1
    adapter_id: opendesign.save.v1
    consumers:
    - designer.capture_mockup
    - designer.write_through
    declared_in: daemon/plugin_subsystem/opendesign/ports.py
    capability_tags:
    - persistence
    - repo-write
    notes: Canonical mockup-path writer; atomic stage-and-rename; the repo copy =
      developer deliverable
  - port_id: od.lint
    version: 1
    adapter_id: opendesign.lint.v1
    consumers:
    - designer.lint_artifact
    - designer.regenerate_after_lint_fail
    declared_in: daemon/plugin_subsystem/opendesign/ports.py
    capability_tags:
    - quality-gate
    - lint
    notes: 16-regex family + parse5 EOF gate; own_outright ported from OD daemon lint-artifact.ts
parity_boundary:
  intentionally_not_vendored:
  - path: apps/daemon/
    reason: "OD daemon + in-repo MCP forwarder; entangled (od-resource-layer \xA7\
      5 row 9) \u2014 not vendored; retired entirely at slice \u2466 (ADR-PLUG-001\
      \ \xA74)"
  - path: apps/daemon/src/brands/
    reason: "Brand presets (19 modules + extraction loop + browser); ENTANGLED (od-resource-layer\
      \ \xA75 row 9) \u2014 design systems cover brand styling; brand flow out of\
      \ scope for v1"
  - path: apps/daemon/src/prompts/
    reason: "Daemon prompt stack (10 TS composer modules); LIGHTLY COUPLED (od-resource-layer\
      \ \xA75 row 10); the 10 composer modules are NOW vendored as snapshot_with_drift_alarm/prompts/daemon/\
      \ @ open-design-v0.23.0; the remainder of apps/daemon/src/prompts/ stays excluded\
      \ until re-evaluated; the Python-native compose Provider (Mode P) is the recommended\
      \ default at slice \u2464"
  - path: packages/contracts/src/prompts/
    reason: "Published prompt mirror (17 files); mirror of daemon prompt stack; two-tree\
      \ drift is real (od-resource-layer \xA71.B) and the 4 seeded divergence-register\
      \ entries track the daemon/contracts asymmetry; the 17 contracts files are NOW\
      \ vendored as snapshot_with_drift_alarm/prompts/contracts/ @ open-design-v0.23.0;\
      \ the daemon-only modules (core-slim) stay asymmetric and register entry id=3\
      \ documents that asymmetry"
  - path: apps/daemon/src/skills/
    reason: "Functional skills (165 dirs) \u2014 STANDALONE-as-catalogue but execution\
      \ requires upstream bundles (od-resource-layer \xA75 row 8); plugin-skill landing\
      \ at slice \u2463 owns the slice-\u2460-aligned consumption path"
  - path: apps/daemon/src/artifacts/
    reason: "Internal lint / parse5 EOF / truncation detectors \u2014 own-outright,\
      \ ported into the generate adapter at slice \u2464 (REC \xA74.1 row 4)"
  - path: templates/
    reason: "Top-level HTML templates (3 entries) \u2014 STANDALONE but ORPHANED on\
      \ upstream main (od-resource-layer \xA72); deprecated, not vendored"
  - path: assets/prompt-templates/image/*.jpg
    reason: "11 preview JPGs (W5 carry-forward from slice \u2461): rendered previews,\
      \ not prompt data; vendored set is the 48 JSON files only; upstream at /home/nea/opt/open-design/assets/prompt-templates/image/\
      \ is READ-ONLY reference"
  not_executed:
  - path: copy_freely/
    reason: "All vendored bytes under copy_freely/ are inert data under resource-only;\
      \ no subtree executes (CON \xA71, CON \xA77 no-runtime-loading sentinel)"
  - path: snapshot_with_drift_alarm/
    reason: "All vendored bytes under snapshot_with_drift_alarm/ are inert data; no\
      \ subtree executes (CON \xA71, CON \xA77 no-runtime-loading sentinel); the Python\
      \ Mode-P compose Provider (slice \u2464) re-expresses the composer in Python,\
      \ not via these vendored TS bytes"
  - path: own_outright/
    reason: "own_outright/ contents are authored locally and not vendored; this manifest\
      \ at slice \u2462 declares the section/paths only; slice \u2464 authors the\
      \ actual content (Turn-3/compose-brief orchestration, lint port, parse5 EOF\
      \ gate port)"
skills:
  entries:
  - skill_id: opendesign.list_systems
    path: skills/opendesign.list_systems.yaml

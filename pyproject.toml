[project]
name = "ensemble"
version = "0.7.10"
description = "Agents Ensemble - Multi-Agent AI Daemon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.14",
    "langchain-openai>=0.2.14",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "watchdog>=6.0.0",
    "sse-starlette>=2.2.0",
    "tiktoken>=0.8.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0",
    "sqlmodel>=0.0.22",
    "croniter>=3.0.0",
    "mcp>=1.9.0",
    "langchain-mcp-adapters>=0.1.0",
    "pytest>=9.0.2",
    "modelcontextprotocol>=1.0.1",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.21.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
] 

[project.scripts]
ensemble = "daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that require a live OpenCode server (run with `pytest -m integration`)",
    "postgres: PostgreSQL-only tests that require a live PostgreSQL server (run with `pytest -m postgres`)",
]
addopts = "-m 'not integration and not postgres'"
asyncio_mode = "auto"
timeout = 30
timeout_method = "thread"

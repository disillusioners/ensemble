[project]
name = "ensemble"
version = "0.1.0"
description = "Agents Ensemble - Multi-Agent AI Daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.14",
    "langchain-openai>=0.2.14",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "watchdog>=6.0.0",
    "sse-starlette>=2.2.0",
    "tiktoken>=0.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.scripts]
ensemble = "daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PostgreSQL test database (Phase 2 — opt-in test infrastructure).
#
# Usage:
#   # Start the database
#   docker compose -f docker-compose.test.yml up -d
#
#   # Wait for it to become healthy
#   docker compose -f docker-compose.test.yml ps
#
#   # Run the opt-in PostgreSQL test suite
#   pytest -m postgres
#
#   # Run just the smoke test
#   pytest tests/postgres/test_smoke.py -m postgres -v
#
# The default `pytest` invocation SKIPS these tests — they're gated by
# the `postgres` marker in pyproject.toml (`addopts = "-m 'not integration
# and not postgres'"`). This keeps the existing ~8000 SQLite tests
# untouched.
#
# Connection string used by tests/postgres/conftest.py:
#   postgresql+psycopg://ensemble:ensemble_dev@localhost:5432/ensemble_test
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ensemble_test
      POSTGRES_USER: ensemble
      POSTGRES_PASSWORD: ensemble_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SH", "pg_isready -U ensemble"]
      interval: 5s
      retries: 5
